name: GitHub Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 매일 한국 시간 오전 6시 17분: 여행 경보 사본을 새로 받아 다시 배포
  schedule:
    - cron: '17 21 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 영국 외무부 여행 경보 사본 갱신 (실패해도 저장소에 있는 사본으로 배포)
      - run: npm run build:advisories
        continue-on-error: true
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
